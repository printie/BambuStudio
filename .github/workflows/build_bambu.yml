on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: false
        type: string

jobs:
  build_bambu:
    name: Build BambuStudio
    runs-on: ${{ inputs.os }}
    env:
      date:
      ver:
      ver_pure:

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - name: Get the version and date on Ubuntu and macOS
        if: inputs.os != 'windows-latest'
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver=V$ver_pure
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the version and date on Windows
        if: inputs.os == 'windows-latest'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SLIC3R_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

  #   Mac
      - name: Build slicer mac
        if: inputs.os == 'macos-13'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          brew unlink cmake || true
          brew tap-new $USER/old-cmake
          brew extract --version=3.31.0 cmake $USER/old-cmake
          brew install $USER/old-cmake/cmake@3.31.0
          brew link --overwrite cmake@3.31.0
          brew pin cmake@3.31.0
          ./BuildMac.sh -s -x -a x86_64 -t 10.15 -1

      - name: Build slicer mac
        if: inputs.os == 'macos-15'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          brew unlink cmake || true
          brew tap-new $USER/old-cmake
          brew extract --version=3.31.0 cmake $USER/old-cmake
          brew install $USER/old-cmake/cmake@3.31.0
          brew link --overwrite cmake@3.31.0
          brew pin cmake@3.31.0
          ./BuildMac.sh -s -x -a universal -t 10.15 -1

      - name: pack mac app
        if: github.ref != 'refs/heads/main' && (inputs.os == 'macos-13' || inputs.os == 'macos-15')
        working-directory: ${{ github.workspace }}
        run: zip -r BambuStudio_Mac_${{inputs.arch}}_${{ env.ver }}.zip ${{ github.workspace }}/build

      - name: Upload artifacts mac
        if: inputs.os == 'macos-13' || inputs.os == 'macos-15'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_Mac_${{inputs.arch}}_${{ env.ver }}
          path: ${{ github.workspace }}/BambuStudio_Mac_${{inputs.arch}}_${{ env.ver }}.zip

  # Windows
      - name: setup MSVC
        if: inputs.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Install nsis and pkgconfig
        if: inputs.os == 'windows-latest'
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          choco install nsis
          choco install pkgconfiglite

      - name: Build slicer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A X64 -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\build\BambuStudio_dep\usr\local" -DCMAKE_INSTALL_PREFIX="../install-dir" -DCMAKE_BUILD_TYPE=Release -DWIN10SDK_PATH="C:/Program Files (x86)/Windows Kits/10/Include/10.0.22000.0"
          cmake --build . --target install --config Release -- -m

      # - name: Create installer Win
      #   if: inputs.os == 'windows-latest'
      #   working-directory: ${{ github.workspace }}/build
      #   run: |
      #     cpack -G NSIS

      - name: Pack app
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip BambuStudio_Windows_${{ env.ver }}_portable.zip ${{ github.workspace }}/install-dir'

      # - name: Pack PDB
      #   if: inputs.os == 'windows-latest'
      #   working-directory: ${{ github.workspace }}/build/src/Release
      #   shell: cmd
      #   run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Upload artifacts Win zip
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_Windows_${{ env.ver }}_portable
          path: ${{ github.workspace }}/BambuStudio_Windows_${{ env.ver }}_portable.zip


  # Ubuntu
      - name: Install dependencies from BuildLinux.sh
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-24.04-arm'
        shell: bash
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-24.04-arm'
        shell: bash
        run: sudo chown $USER -R ./

      - name: Build slicer
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          ./BuildLinux.sh -isfr
          mv -n ./build/BambuStudio_ubu64.AppImage ./build/Bambu_Studio_${{inputs.os}}_${{ env.ver }}.AppImage

      - name: Package headless Linux CLI bundle
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          set -euo pipefail

          bin_path="$(find "${{ github.workspace }}/build" -type f -name 'bambu-studio' -perm -111 | head -n 1 || true)"
          if [[ -z "${bin_path}" ]]; then
            echo "::error::Could not locate built bambu-studio binary"
            exit 1
          fi

          bundle_name="Bambu_Studio_${{inputs.os}}_${{ env.ver }}_headless_cli"
          bundle_root="${{ github.workspace }}/build/${bundle_name}"
          rm -rf "${bundle_root}"
          mkdir -p "${bundle_root}/bin" "${bundle_root}/lib"

          cp "${bin_path}" "${bundle_root}/bin/bambu-studio.bin"
          chmod +x "${bundle_root}/bin/bambu-studio.bin"

          ldd "${bin_path}" | awk '/=> \// || /^\// { for (i = 1; i <= NF; i++) if ($i ~ /^\//) print $i }' | sort -u > "${bundle_root}/ldd-libs.txt"

          while IFS= read -r lib; do
            base="$(basename "${lib}")"
            case "${base}" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|ld-linux*.so*)
                continue
                ;;
            esac
            cp -L "${lib}" "${bundle_root}/lib/"
          done < "${bundle_root}/ldd-libs.txt"

          cat > "${bundle_root}/bambu-studio" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          script_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${script_dir}/lib:${LD_LIBRARY_PATH:-}"
          exec "${script_dir}/bin/bambu-studio.bin" "$@"
          EOF
          chmod +x "${bundle_root}/bambu-studio"

          cat > "${bundle_root}/README.txt" <<'EOF'
          Headless Bambu Studio CLI bundle for Linux.

          Usage:
            ./bambu-studio --help
            ./bambu-studio --allow-newer-file --no-check --slice 0 --skip-precheck --skip-gcode-export --outputdir <outdir> <input.3mf>

          Notes:
          - Wrapper sets LD_LIBRARY_PATH to ./lib so it can run without host GTK packages.
          - This is intended for server-side CLI slicing workflows.
          EOF

          tar -C "${{ github.workspace }}/build" -czf "${{ github.workspace }}/build/${bundle_name}.tar.gz" "${bundle_name}"
          sha256sum "${{ github.workspace }}/build/${bundle_name}.tar.gz" > "${{ github.workspace }}/build/${bundle_name}.tar.gz.sha256"

      # - name: Build orca_custom_preset_tests
      #   if: github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-22.04'
      #   working-directory: ${{ github.workspace }}/build/src
      #   shell: bash
      #   run: |
      #     ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -g 1
      #     cd ${{ github.workspace }}/resources/profiles
      #     zip -r orca_custom_preset_tests.zip user/

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-24.04-arm') }}
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_${{inputs.os}}_${{ env.ver }}
          path: './build/Bambu_Studio_${{inputs.os}}_${{ env.ver }}.AppImage'

      - name: Upload artifacts Ubuntu headless CLI
        if: ${{ ! env.ACT && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-24.04-arm') }}
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_${{inputs.os}}_${{ env.ver }}_headless_cli
          path: |
            ./build/Bambu_Studio_${{inputs.os}}_${{ env.ver }}_headless_cli.tar.gz
            ./build/Bambu_Studio_${{inputs.os}}_${{ env.ver }}_headless_cli.tar.gz.sha256

      # - name: Deploy Ubuntu release
      #   if: ${{ ! env.ACT && github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-22.04' }}
      #   uses: WebFreak001/deploy-nightly@v3.2.0
      #   with:
      #     upload_url: https://uploads.github.com/repos/SoftFever/OrcaSlicer/releases/137995723/assets{?name,label}
      #     release_id: 137995723
      #     asset_path: ./build/OrcaSlicer_Linux_${{ env.ver }}.AppImage
      #     asset_name: OrcaSlicer_Linux_${{ env.ver }}.AppImage
      #     asset_content_type: application/octet-stream
